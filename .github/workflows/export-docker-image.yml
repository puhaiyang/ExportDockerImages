name: Export Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: "要导出的 Docker 镜像，如 nginx:latest"
        required: true
        default: "nginx:latest"

jobs:
  export-and-upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          IMAGE="${{ github.event.inputs.docker_image }}"

          # 转换镜像名为安全文件名
          SAFE_NAME=$(echo "$IMAGE" | sed 's/[\/:]/_/g')
          FILE="${SAFE_NAME}.tar"

          TAG="export-$(date +%Y%m%d-%H%M%S)"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Pull Docker image
        run: docker pull "$IMAGE"

      - name: Save Docker image to tar
        run: docker save "$IMAGE" -o "$FILE"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Docker Image Export ${{ env.TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Docker Image to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
